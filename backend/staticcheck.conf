# staticcheck configuration
#
# SA1019 (use of deprecated identifier) is disabled for one specific reason: all eight
# services call echomw.Logger(), which Echo deprecated in favour of RequestLoggerWithConfig.
# Migrating is not a mechanical swap — the replacement takes a config struct and changes the
# emitted log format, so it is a deliberate observability change, not lint cleanup.
#
# This is recorded debt, not an exemption. Re-enable SA1019 as part of that migration; until
# then it would make `make lint` permanently red, which is how lint gates get ignored.
checks = ["all", "-SA1019", "-ST1000", "-ST1003", "-ST1020", "-ST1021", "-ST1022"]
