syntax = "proto3";

package messaging;

option go_package = "ngac-platform/proto/messaging";

import "google/protobuf/timestamp.proto";

// ═══════════════════════════════════════════════
// CLIENT → SERVER envelope
// ═══════════════════════════════════════════════

message ClientEnvelope {
  oneof payload {
    AuthRequest        auth        = 1;
    SubscribeRequest   subscribe   = 2;
    UnsubscribeRequest unsubscribe = 3;
    TypingRequest      typing      = 4;
    ViewRequest        view        = 5;
  }
}

message AuthRequest {
  string token = 1;
}

// Exactly one of channel_id / workspace_id is set. A workspace subscription
// delivers that workspace's DomainEvents and needs read on the workspace.
message SubscribeRequest {
  string channel_id   = 1;
  string workspace_id = 2;
}

message UnsubscribeRequest {
  string channel_id   = 1;
  string workspace_id = 2;
}

message TypingRequest {
  string channel_id = 1;
}

// ViewRequest says which conversation this session has on screen right now,
// while its page is visible; an empty channel_id means none. Being subscribed
// is not viewing: the navigator subscribes to every listed conversation. Push
// is held back only for the conversation a session is actually looking at.
message ViewRequest {
  string channel_id = 1;
}

// ═══════════════════════════════════════════════
// SERVER → CLIENT envelope
// ═══════════════════════════════════════════════

message ServerEnvelope {
  oneof payload {
    AuthResponse       auth_response  = 1;
    ChatMessage        chat_message   = 2;
    TypingEvent        typing_event   = 3;
    NotificationEvent  notification   = 4;
    UnreadCountEvent   unread_count   = 5;
    ThreadReplyEvent   thread_reply   = 6;
    ReactionEvent      reaction_event = 8;
    PinEvent           pin_event      = 9;
    ReadReceiptEvent   read_receipt   = 10;
    PollVoteEvent      poll_vote      = 11;
    TaskUpdateEvent    task_update    = 12;
    ErrorEvent         error          = 15;
    ApprovalEvent      approval_event = 16;
    PresenceEvent      presence_event = 17;
    DomainEvent        domain_event   = 18;
    WorkspaceSubscribed workspace_subscribed = 19;
    ThreadStateEvent   thread_state   = 20;
    MessageEditedEvent  message_edited  = 21;
    MessageDeletedEvent message_deleted = 22;
    CallEvent           call_event      = 23;
  }
  // asset_updated, drive_object and drive_perm were replaced by domain_event.
  reserved 7, 13, 14;
  reserved "asset_updated", "drive_object", "drive_perm";
}

message AuthResponse {
  bool   ok      = 1;
  string user_id = 2;
  string reason  = 3;
}

message ChatMessage {
  string id              = 1;
  string channel_id      = 2;
  string sender_id       = 3;
  string sender_name     = 4;
  string content         = 5;
  google.protobuf.Timestamp created_at = 6;
  string message_type    = 7;
  string parent_message_id = 8;
  int32  reply_count     = 9;
  string content_format  = 10;    // "markdown", "plain"
  repeated string mentions = 11;  // User IDs mentioned
  string linked_entity_type = 12;
  string linked_entity_id = 13;
  repeated ChatAttachment attachments = 14;
  ChatQuote quoted = 15;  // The message this one quotes, when any
}

// ChatQuote is what a quote shows (see messaging.QuotedMessage).
message ChatQuote {
  string id          = 1;
  string sender_id   = 2;
  string sender_name = 3;
  string text        = 4;
  bool   deleted     = 5;
}

// ChatAttachment is one file of a message (see messaging.MessageAttachment).
message ChatAttachment {
  string drive_file_id = 1;
  string file_name     = 2;
  string mime_type     = 3;
  int64  size_bytes    = 4;
  int32  width         = 5;
  int32  height        = 6;
}

message TypingEvent {
  string channel_id = 1;
  string username   = 2;
}

message PresenceEvent {
  string user_id  = 1;
  string username = 2;
  string status   = 3; // "online" or "offline"
}

message NotificationEvent {
  string id          = 1;
  string type        = 2;
  string title       = 3;
  string body        = 4;
  string entity_type = 5;
  string entity_id   = 6;
}

message UnreadCountEvent {
  int32 count = 1;
}

message ThreadReplyEvent {
  ChatMessage message          = 1;
  string      parent_message_id = 2;
  // The thread's summary after this reply, the same for every subscriber.
  int32                     reply_count           = 3;
  google.protobuf.Timestamp last_reply_at         = 4;
  repeated string           reply_participant_ids = 5; // users.id of the 3 most recent distinct repliers, newest first
}

// ThreadStateEvent is one user's own state of one thread, sent only to that
// user's sessions: after a reply in a thread they follow, and when they
// follow, unfollow or read it on any device.
message ThreadStateEvent {
  string root_message_id = 1;
  string channel_id      = 2;
  bool   following       = 3;
  int32  unread_count    = 4;
  // When the server read this state; a client keeps the newest per thread.
  google.protobuf.Timestamp as_of = 5;
}

// ═══════════════════════════════════════════════
// NEW: Lark Chat Parity Events
// ═══════════════════════════════════════════════

message ReactionEvent {
  string message_id = 1;
  string channel_id = 2;
  string user_id    = 3;
  string username   = 4;
  string emoji      = 5;
  string action     = 6;  // "add" | "remove"
}

message PinEvent {
  string channel_id = 1;
  string message_id = 2;
  string user_id    = 3;
  string action     = 4;  // "pin" | "unpin"
}

message ReadReceiptEvent {
  string channel_id      = 1;
  string user_id         = 2;
  string last_message_id = 3;
}

// PollVoteEvent says a poll changed (a vote, a withdrawal, a close). It names
// the poll only: counts would show results to members who have not voted, so
// clients refetch the poll under their own view. vote_count and total_votes are
// no longer filled.
message PollVoteEvent {
  string poll_id    = 1;
  string channel_id = 2;
  string option_id  = 3;
  int32  vote_count = 4;
  int32  total_votes = 5;
}

message TaskUpdateEvent {
  string task_id     = 1;
  string channel_id  = 2;
  string status      = 3;
  string assignee_id = 4;
  string title       = 5;
}

message ErrorEvent {
  int32  code    = 1;
  string message = 2;
}

// ═══════════════════════════════════════════════
// Domain events (realtime change notices)
// ═══════════════════════════════════════════════

// DomainEvent tells a client that something it may be showing changed. It
// carries ids and the kind of change, never content: the client invalidates the
// matching queries and refetches under its own authorization.
//
// domain/kind pairs are listed in docs/specs/realtime-event-delivery/spec.md.
message DomainEvent {
  string domain          = 1;  // drive | channel | workspace | document | asset | permission
  string kind            = 2;  // created | updated | deleted | moved | ...
  string tenant_id       = 3;
  string workspace_id    = 4;
  repeated string ids    = 5;  // entities the change touched
  string parent_id       = 6;  // destination / containing folder, when relevant
  string old_parent_id   = 7;  // folder an item left (moves)
  string actor_user_id   = 8;  // who caused the change
  // Per-workspace sequence, assigned by the hub to workspace-wide events. A
  // client that sees a hole resynchronises. 0 for events addressed to a
  // channel or to specific users: those are not part of the workspace stream.
  uint64 seq             = 9;
  string channel_id      = 10; // set for channel-addressed events
}

// WorkspaceSubscribed answers a workspace subscription. seq is the last
// sequence number issued before the subscription took effect; everything after
// it will arrive, so a client that refetches on this ack misses nothing.
message WorkspaceSubscribed {
  string workspace_id = 1;
  uint64 seq          = 2;
  // True when the subscription was refused. The session follows nothing, but
  // knows its attempt was decided, so it can fetch what it missed on its own.
  bool   denied       = 3;
}

// ═══════════════════════════════════════════════
// Approval Events (realtime approval status sync)
// ═══════════════════════════════════════════════

message ApprovalEvent {
  string request_id     = 1;
  string status         = 2;  // "pending", "approved", "rejected"
  string action         = 3;  // "created", "approved", "rejected", "step_advanced"
  string actor_node_id  = 4;
  string template_name  = 5;
  string tenant_id      = 6;
  string workspace_id   = 7;
}

// MessageEditedEvent carries a message whose sender changed its text.
message MessageEditedEvent {
  ChatMessage               message   = 1;
  google.protobuf.Timestamp edited_at = 2;
}

// MessageDeletedEvent says a message was deleted. A root message with replies
// stays as a placeholder (keep_placeholder); any other leaves the view.
message MessageDeletedEvent {
  string message_id        = 1;
  string channel_id        = 2;
  string parent_message_id = 3;
  bool   keep_placeholder  = 4;
  int32  reply_count       = 5;   // The thread's count after a reply was deleted
}

// CallEvent is a change of a call. ring, cancel, answered, declined and missed
// go to every device of the two people of a direct call (answered stops the
// other devices ringing); state goes to the conversation's subscribers, so a
// card or a "Join" button follows who is in the call.
message CallEvent {
  string type                 = 1;  // ring | cancel | answered | declined | missed | state
  string call_id              = 2;
  string channel_id           = 3;
  string kind                 = 4;  // audio | video
  string status               = 5;  // ringing | active | ended | missed | declined | cancelled
  string caller_id            = 6;
  string caller_name          = 7;
  string caller_avatar_url    = 8;
  int32  participant_count    = 9;
  repeated string participant_ids = 10;
  google.protobuf.Timestamp started_at = 11;
  google.protobuf.Timestamp ended_at   = 12;
}
