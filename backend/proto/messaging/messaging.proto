syntax = "proto3";

package messaging;

option go_package = "ngac-platform/proto/messaging";

import "google/protobuf/timestamp.proto";

service MessagingService {
  // Channels
  rpc CreateChannel(CreateChannelRequest) returns (Channel);
  rpc ListChannels(ListChannelsRequest) returns (ChannelList);
  rpc GetChannel(GetChannelRequest) returns (Channel);

  // Workspace-wide channel (#general). Service-to-service only: neither is
  // reachable by a user. The first is the only way a channel of type
  // 'workspace' is made (auth service); the second puts a member of the
  // workspace into it (auth and workspace services).
  rpc ProvisionWorkspaceChannel(ProvisionWorkspaceChannelRequest) returns (Channel);
  rpc JoinWorkspaceChannel(JoinWorkspaceChannelRequest) returns (Empty);

  // Channel members
  rpc AddChannelMember(AddChannelMemberRequest) returns (Empty);
  rpc RemoveChannelMember(RemoveChannelMemberRequest) returns (Empty);
  rpc ListChannelMembers(ListChannelMembersRequest) returns (ChannelMemberList);

  // Messages
  rpc SendMessage(SendMessageRequest) returns (Message);
  rpc GetMessages(GetMessagesRequest) returns (MessageList);

  // Threads
  rpc GetThread(GetThreadRequest) returns (MessageList);
  rpc FindThreadsByEntity(FindThreadsByEntityRequest) returns (MessageList);
  rpc FollowThread(ThreadRequest) returns (Empty);
  rpc UnfollowThread(ThreadRequest) returns (Empty);
  rpc MarkThreadRead(ThreadRequest) returns (Empty);
  rpc ListThreads(ListThreadsRequest) returns (MessageList);

  // Message lifecycle
  rpc EditMessage(EditMessageRequest) returns (Message);
  rpc DeleteMessage(MessageRef) returns (Empty);
  rpc MarkMessageUnread(MessageRef) returns (Empty);

  // DMs
  rpc CreateDM(CreateDMRequest) returns (Channel);
  rpc ListDMs(ListDMsRequest) returns (ChannelList);

  // Reactions
  rpc AddReaction(AddReactionRequest) returns (Empty);
  rpc RemoveReaction(RemoveReactionRequest) returns (Empty);
  rpc ListReactions(ListReactionsRequest) returns (ReactionList);

  // Pins
  rpc PinMessage(PinMessageRequest) returns (Empty);
  rpc UnpinMessage(UnpinMessageRequest) returns (Empty);
  rpc ListPins(ListPinsRequest) returns (PinnedMessageList);

  // Read receipts
  rpc MarkChannelRead(MarkChannelReadRequest) returns (Empty);
  rpc GetUnreadCounts(GetUnreadCountsRequest) returns (ChannelUnreadList);

  // Search
  rpc SearchMessages(SearchMessagesRequest) returns (MessageList);

  // Polls
  rpc CreatePoll(CreatePollRequest) returns (Poll);
  rpc VotePoll(VotePollRequest) returns (Empty);
  rpc RemoveVote(RemoveVoteRequest) returns (Empty);
  rpc GetPoll(GetPollRequest) returns (Poll);
  rpc ClosePoll(ClosePollRequest) returns (Poll);

  // Tasks
  rpc CreateTask(CreateTaskRequest) returns (ChatTask);
  rpc UpdateTask(UpdateTaskRequest) returns (ChatTask);
  rpc ListTasks(ListTasksRequest) returns (ChatTaskList);
}

// NotificationService manages user notifications across the platform.
service NotificationService {
  rpc ListNotifications(ListNotificationsRequest) returns (NotificationList);
  rpc MarkRead(MarkNotificationReadRequest) returns (Empty);
  rpc MarkAllRead(MarkAllNotificationsReadRequest) returns (Empty);
  rpc GetUnreadCount(GetNotificationUnreadCountRequest) returns (NotificationUnreadCountResponse);
}

message Empty {}

// ============================================
// Channel Messages
// ============================================

message Channel {
  string id = 1;
  string name = 2;
  string channel_type = 3;  // "workspace", "private", "dm"
  string workspace_id = 4;
  string ngac_oa_id = 5;
  string ngac_ua_id = 6;
  string created_by = 7;
  google.protobuf.Timestamp created_at = 8;
  string topic = 9;           // Short topic line shown below channel name
  string description = 10;    // Longer channel description
  int32 member_count = 11;    // Denormalized member count
  bool starred = 12;          // The caller starred this conversation (set where a caller is known)
  string avatar_url = 13;     // The group's picture address ("" when it has none); never set on a DM
}

message CreateChannelRequest {
  string name = 1;
  string workspace_id = 2;
  string user_id = 3 [deprecated = true]; // ignored: the caller comes from request metadata (pkg/grpcauth)
  string user_ngac_node_id = 4 [deprecated = true]; // ignored: the caller comes from request metadata (pkg/grpcauth)
  string channel_type = 5;
}

// ProvisionWorkspaceChannelRequest names the workspace-wide channel to create and
// the person creating it (the workspace's owner, who becomes its first member).
// Accepted on the auth service's identity only.
message ProvisionWorkspaceChannelRequest {
  string workspace_id = 1;
  string name = 2;
  string creator_user_id = 3;
  string creator_ngac_node_id = 4;
}

// JoinWorkspaceChannelRequest names a member of the workspace to put into its
// workspace-wide channel. Accepted on the auth or workspace service's identity
// only; the person must already be a member of the workspace.
message JoinWorkspaceChannelRequest {
  string workspace_id = 1;
  string user_ngac_node_id = 2;
  string user_id = 3; // the person's users.id; the policy answers on their behalf
}

message ListChannelsRequest {
  string workspace_id = 1;
  string user_ngac_node_id = 2 [deprecated = true]; // ignored: the caller comes from request metadata (pkg/grpcauth)
}

message GetChannelRequest {
  string channel_id = 1;
  string user_ngac_node_id = 2 [deprecated = true]; // ignored: the caller comes from request metadata (pkg/grpcauth)
}

message ChannelList {
  repeated Channel channels = 1;
}

// ============================================
// Channel Member Messages
// ============================================

message AddChannelMemberRequest {
  string channel_id = 1;
  string requester_ngac_node_id = 2 [deprecated = true]; // ignored: the caller comes from request metadata (pkg/grpcauth)
  string target_ngac_node_id = 3;
}

message RemoveChannelMemberRequest {
  string channel_id = 1;
  string requester_ngac_node_id = 2 [deprecated = true]; // ignored: the caller comes from request metadata (pkg/grpcauth)
  string target_ngac_node_id = 3;
}

message ListChannelMembersRequest {
  string channel_id = 1;
  string user_ngac_node_id = 2 [deprecated = true]; // ignored: the caller comes from request metadata (pkg/grpcauth)
}

message ChannelMember {
  string user_id = 1;
  string username = 2;
  string ngac_node_id = 3;
}

message ChannelMemberList {
  repeated ChannelMember members = 1;
}

// ============================================
// Core Message Types
// ============================================

message SendMessageRequest {
  string channel_id = 1;
  string sender_id = 2 [deprecated = true]; // ignored: the caller comes from request metadata (pkg/grpcauth)
  string sender_ngac_node_id = 3 [deprecated = true]; // ignored: the caller comes from request metadata (pkg/grpcauth)
  string content = 4;
  string message_type = 5;          // "user" (default), "system"
  string parent_message_id = 6;     // Thread: reply to this message
  string linked_entity_type = 7;    // "asset", "document", "poll", "task"
  string linked_entity_id = 8;      // ID of the linked entity
  string content_format = 9;        // "markdown" (default), "plain"
  repeated string mentions = 10;    // User IDs mentioned in content
  // Files from the channel's drive to send with the text in this one message
  // (at most 20). Only drive_file_id, width and height are read; the server
  // fills in the rest from the file.
  repeated MessageAttachment attachments = 11;
  string quoted_message_id = 12;    // A message of the same channel this one quotes
}

message Message {
  string id = 1;
  string channel_id = 2;
  string sender_id = 3;
  string sender_name = 4;
  string content = 5;
  google.protobuf.Timestamp created_at = 6;
  string message_type = 7;          // "user", "system"
  string parent_message_id = 8;     // Non-empty if this is a thread reply
  string linked_entity_type = 9;
  string linked_entity_id = 10;
  int32 reply_count = 11;           // Number of replies in thread
  string content_format = 12;       // "markdown", "plain"
  repeated string mentions = 13;    // User IDs mentioned
  repeated ReactionGroup reactions = 14;  // Aggregated reactions
  bool is_pinned = 15;              // Whether message is pinned
  // Thread summary of a root message. last_reply_at is unset until the first
  // reply; the other three are as seen by the caller.
  google.protobuf.Timestamp last_reply_at = 16;
  repeated string reply_participant_ids = 17; // User IDs of the 3 most recent distinct repliers, newest first
  bool following = 18;                        // Caller follows the thread
  int32 thread_unread_count = 19;             // Replies the caller has not read; 0 when not following
  repeated MessageAttachment attachments = 20; // In the order they were attached
  google.protobuf.Timestamp edited_at = 21;    // Set once its sender changed the text
  bool deleted = 22;                           // Deleted: no body, kept only as a thread's placeholder
  QuotedMessage quoted = 23;                   // The message this one quotes, when any
  // Set only in the caller's starred and mentions feeds, never in a channel's own list.
  bool starred = 24;                           // Starred feed: always true
  google.protobuf.Timestamp starred_at = 25;   // Starred feed: when the caller starred it
  bool unread = 26;                            // Mentions feed: the caller has not read it yet
}

// QuotedMessage is what a quote shows of the message it quotes.
message QuotedMessage {
  string id          = 1;
  string sender_id   = 2;
  string sender_name = 3;
  string text        = 4;   // The opening of its plain text; empty when deleted
  bool   deleted     = 5;
}

// MessageRef names one message.
message MessageRef {
  string message_id = 1;
}

message EditMessageRequest {
  string message_id     = 1;
  string content        = 2;
  string content_format = 3;
}

// MessageAttachment is one file of the channel's drive shown in a message.
message MessageAttachment {
  string drive_file_id = 1;
  string file_name     = 2;
  string mime_type     = 3;
  int64  size_bytes    = 4;
  int32  width         = 5;   // Pixels, images only; 0 when unknown
  int32  height        = 6;
}

message GetMessagesRequest {
  string channel_id = 1;
  string user_ngac_node_id = 2 [deprecated = true]; // ignored: the caller comes from request metadata (pkg/grpcauth)
  string before = 3;  // cursor: timestamp string
  int32 limit = 4;
}

message MessageList {
  repeated Message messages = 1;
  bool has_more = 2;
}

// ThreadRequest names a thread by its root message.
message ThreadRequest {
  string message_id = 1;
}

message ListThreadsRequest {
  string channel_id = 1;
  string filter = 2;   // "all" (default), "following" or "unread"
  string before = 3;   // RFC 3339 last-reply time: return threads that moved before it
  int32 limit = 4;
  string before_id = 5; // root message id of the last thread of the previous page; breaks ties on before
}

message GetThreadRequest {
  string message_id = 1;
  string user_ngac_node_id = 2 [deprecated = true]; // ignored: the caller comes from request metadata (pkg/grpcauth)
}

message FindThreadsByEntityRequest {
  string entity_type = 1;
  string entity_id = 2;
  string user_ngac_node_id = 3 [deprecated = true]; // ignored: the caller comes from request metadata (pkg/grpcauth)
}

// ============================================
// DM Messages
// ============================================

message CreateDMRequest {
  string user_id = 1 [deprecated = true]; // ignored: the caller comes from request metadata (pkg/grpcauth)
  string user_ngac_node_id = 2 [deprecated = true]; // ignored: the caller comes from request metadata (pkg/grpcauth)
  string target_user_id = 3;
  string target_ngac_node_id = 4;
}

message ListDMsRequest {
  string user_ngac_node_id = 1 [deprecated = true]; // ignored: the caller comes from request metadata (pkg/grpcauth)
}

// ============================================
// Reaction Messages
// ============================================

message AddReactionRequest {
  string message_id = 1;
  string user_id = 2;
  string emoji = 3;
}

message RemoveReactionRequest {
  string message_id = 1;
  string user_id = 2;
  string emoji = 3;
}

message ListReactionsRequest {
  string message_id = 1;
}

message Reaction {
  string id = 1;
  string message_id = 2;
  string user_id = 3;
  string emoji = 4;
  google.protobuf.Timestamp created_at = 5;
}

message ReactionGroup {
  string emoji = 1;
  int32 count = 2;
  repeated string user_ids = 3;
}

message ReactionList {
  repeated Reaction reactions = 1;
}

// ============================================
// Pin Messages
// ============================================

message PinMessageRequest {
  string channel_id = 1;
  string message_id = 2;
  string user_id = 3;
}

message UnpinMessageRequest {
  string channel_id = 1;
  string message_id = 2;
}

message ListPinsRequest {
  string channel_id = 1;
}

message PinnedMessage {
  Message message = 1;
  string pinned_by = 2;
  google.protobuf.Timestamp pinned_at = 3;
}

message PinnedMessageList {
  repeated PinnedMessage pins = 1;
}

// ============================================
// Read Receipt Messages
// ============================================

message MarkChannelReadRequest {
  string channel_id = 1;
  string user_id = 2;
  string last_message_id = 3;
}

message GetUnreadCountsRequest {
  string user_id = 1;
}

message ChannelUnread {
  string channel_id = 1;
  int32 unread_count = 2;
  string last_read_message_id = 3;
  int32 thread_unread_count = 4;    // Unread replies in the threads of this channel the caller follows
  string notification_level = 5;    // "all" | "main" | "off": the caller's choice for this conversation
  int32 mention_count = 6;          // Unread messages that mention the caller (counted at every level)
  bool starred = 7;                 // The caller starred this conversation
  google.protobuf.Timestamp starred_at = 8; // When the caller starred it; unset when not starred
}

message ChannelUnreadList {
  repeated ChannelUnread channels = 1;
}

// ActivityMessage is the opening of one message, as the conversation list previews it.
message ActivityMessage {
  string id = 1;
  string sender_id = 2;
  string sender_name = 3;
  string preview = 4;               // Plain text, at most 140 characters
  string kind = 5;                  // "text" | "attachment" | "poll" | "task" | "card"
  string attachment_name = 6;       // File name of the first attachment; only when kind is "attachment"
  repeated string mentions = 7;     // User IDs mentioned
  google.protobuf.Timestamp created_at = 8;
  string parent_message_id = 9;     // Set only on a thread reply
}

// ConversationActivity is the latest main-stream message of a conversation the
// caller reads, and its latest thread reply when that is newer.
message ConversationActivity {
  string channel_id = 1;
  ActivityMessage latest = 2;
  ActivityMessage latest_reply = 3;
}

message ConversationActivityList {
  repeated ConversationActivity channels = 1;
}

// ============================================
// Search Messages
// ============================================

message SearchMessagesRequest {
  string channel_id = 1;
  string query = 2;
  int32 limit = 3;
  string user_ngac_node_id = 4 [deprecated = true]; // ignored: the caller comes from request metadata (pkg/grpcauth)
}

// ============================================
// Poll Messages
// ============================================

message CreatePollRequest {
  string channel_id = 1;
  string user_id = 2 [deprecated = true]; // ignored: the caller comes from request metadata (pkg/grpcauth)
  string user_ngac_node_id = 3 [deprecated = true]; // ignored: the caller comes from request metadata (pkg/grpcauth)
  string question = 4;
  repeated string options = 5;
  bool is_multi = 6;
  bool is_anonymous = 7;
  google.protobuf.Timestamp ends_at = 8;
}

message VotePollRequest {
  string poll_id = 1;
  string option_id = 2;
  string user_id = 3;
}

message RemoveVoteRequest {
  string poll_id = 1;
  string option_id = 2;
  string user_id = 3;
}

message GetPollRequest {
  string poll_id = 1;
}

message PollOption {
  string id = 1;
  string text = 2;
  int32 position = 3;
  int32 vote_count = 4;
  repeated string voter_ids = 5;  // Empty if anonymous
}

message Poll {
  string id = 1;
  string message_id = 2;
  string channel_id = 3;
  string question = 4;
  repeated PollOption options = 5;
  bool is_multi = 6;
  bool is_anonymous = 7;
  string created_by = 8;
  google.protobuf.Timestamp ends_at = 9;
  google.protobuf.Timestamp created_at = 10;
  int32 total_votes = 11;
  // As the caller sees it: results show once they voted or the poll closed;
  // until then vote counts, totals and voters are left out.
  bool results_visible = 12;
  repeated string my_option_ids = 13;
  bool closed = 14;                       // Closed early, or past ends_at
  google.protobuf.Timestamp closed_at = 15;
}

message ClosePollRequest {
  string poll_id = 1;
}

// ============================================
// Chat Task Messages
// ============================================

message CreateTaskRequest {
  string channel_id = 1;
  string user_id = 2 [deprecated = true]; // ignored: the caller comes from request metadata (pkg/grpcauth)
  string user_ngac_node_id = 3 [deprecated = true]; // ignored: the caller comes from request metadata (pkg/grpcauth)
  string title = 4;
  string assignee_id = 5;
  string due_date = 6;  // "YYYY-MM-DD"
}

message UpdateTaskRequest {
  string task_id = 1;
  string user_id = 2;
  string status = 3;       // "todo", "in_progress", "done"
  string assignee_id = 4;
  string title = 5;
  string due_date = 6;
}

message ListTasksRequest {
  string channel_id = 1;
  string status = 2;  // filter by status, empty = all
}

message ChatTask {
  string id = 1;
  string message_id = 2;
  string channel_id = 3;
  string title = 4;
  string assignee_id = 5;
  string assignee_name = 6;
  string status = 7;
  string due_date = 8;
  string created_by = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message ChatTaskList {
  repeated ChatTask tasks = 1;
}

// ============================================
// Notification Messages
// ============================================

message Notification {
  string id = 1;
  string user_id = 2;
  string type = 3;                   // "asset_requested", "asset_approved", "asset_assigned", "thread_reply", "mention"
  string title = 4;
  string body = 5;
  string entity_type = 6;           // "asset", "asset_request", "message", etc.
  string entity_id = 7;
  bool read = 8;
  google.protobuf.Timestamp created_at = 9;
}

message ListNotificationsRequest {
  string user_id = 1 [deprecated = true]; // ignored: the caller comes from request metadata (pkg/grpcauth)
  int32 limit = 2;
  int32 offset = 3;
}

message NotificationList {
  repeated Notification notifications = 1;
  int32 total = 2;
  int32 unread_count = 3;
}

message MarkNotificationReadRequest {
  string notification_id = 1;
  string user_id = 2 [deprecated = true]; // ignored: the caller comes from request metadata (pkg/grpcauth)
}

message MarkAllNotificationsReadRequest {
  string user_id = 1 [deprecated = true]; // ignored: the caller comes from request metadata (pkg/grpcauth)
}

message GetNotificationUnreadCountRequest {
  string user_id = 1 [deprecated = true]; // ignored: the caller comes from request metadata (pkg/grpcauth)
}

message NotificationUnreadCountResponse {
  int32 count = 1;
}

// --- Calls ---
// A voice or video call in a conversation. The media runs in LiveKit; the room
// is named by the call id, which never reaches the screen.

message CallPerson {
  string user_id = 1;
  string display_name = 2;
  string avatar_url = 3;
  google.protobuf.Timestamp joined_at = 4;
}

message Call {
  string id = 1;
  string channel_id = 2;
  string kind = 3;    // audio | video
  string status = 4;  // ringing | active | ended | missed | declined | cancelled
  string started_by = 5;
  string started_by_name = 6;
  string started_by_avatar_url = 7;
  string message_id = 8;  // the card announcing the call
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp ended_at = 11;
  google.protobuf.Timestamp ring_expires_at = 12;
  repeated CallPerson participants = 13;  // in the call now
  int32 taker_count = 14;                 // everyone who was ever in it
  string calendar_event_id = 15;          // the event a calendar event's call belongs to; channel_id is empty then
}

// CallJoin is a ticket into a call's room: a LiveKit token valid for a few
// minutes, and the address the browser opens.
message CallJoin {
  Call call = 1;
  string token = 2;
  string url = 3;
}
