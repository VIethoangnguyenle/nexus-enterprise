<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The faces the first screen is set in: body text and the page title, both
         subsets a Vietnamese line needs. Fetched with the bundle instead of after the
         first paint, so a first visit does not show a fallback face that then swaps. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/be-vietnam-pro/files/be-vietnam-pro-latin-400-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/be-vietnam-pro/files/be-vietnam-pro-vietnamese-400-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/bricolage-grotesque/files/bricolage-grotesque-latin-700-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/bricolage-grotesque/files/bricolage-grotesque-vietnamese-700-normal.woff2" />
    <meta name="theme-color" content="#f1f8f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a1414" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nexus" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <script>
      /* Before the bundle runs: put the stored theme and motion choice on <html>, so a reload
         does not paint light and then flip. Reads the signed-in person's own choice, else the
         device's last. Mirrors src/lib/preferences.ts; any failure leaves the defaults. */
      try {
        var q = new URLSearchParams(location.search).get('user')
        var auth = JSON.parse(localStorage.getItem('ngac-auth' + (q ? '-' + q : '')) || 'null')
        var uid = auth && auth.state && auth.state.user && auth.state.user.id
        var raw = (uid && localStorage.getItem('ngac-prefs:' + uid)) || localStorage.getItem('ngac-prefs:last')
        var p = raw ? JSON.parse(raw) : null
        if (p) {
          var root = document.documentElement
          var dark = p.theme === 'dark' || (p.theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) root.setAttribute('data-theme', 'dark')
          if (p.motion === 'reduce') root.setAttribute('data-motion', 'reduce')
        }
      } catch (e) { /* defaults */ }
    </script>
    <title>Nexus</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
