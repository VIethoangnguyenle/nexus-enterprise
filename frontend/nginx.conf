server {
    listen 80;
    server_name zump-biz.vn localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets on the fly (the entry chunk is ~2.4 MB raw, ~650 KB gzipped); html is always
    # compressed. Same settings as deploy/nginx/default.conf, which production mounts over this file.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript text/javascript
               application/manifest+json image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

    # SPA fallback — all routes served by index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caching for static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
