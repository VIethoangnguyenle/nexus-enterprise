# Production edge: the only container (besides MinIO's presigned-URL host) on the shared `traefik`
# network. Traefik terminates TLS and forwards everything for nexus.zaneng.xyz here; this server
# serves the SPA and proxies /api/* to the services over the internal `nexus` network. The Go
# services have no route from, or to, the shared network.
#
# Routing mirrors the dev Traefik rules in docker-compose.yml (priority in brackets):
#   ws 200 > document/messaging/asset/drive/approval 120 > auth 110 > workspace 100 > SPA 1
# nginx order of evaluation does the same job: ^~ prefix, then regexes in file order, then the
# longest plain prefix. Sub-resource regexes under /api/workspaces/<id>/ therefore beat the plain
# /api/workspaces prefix, exactly as the higher-priority Traefik routers did.
#
# Mounted at /etc/nginx/conf.d/default.conf; sibling files are mounted under /etc/nginx/nexus/.
# Upstreams use variables plus the Docker resolver, so a recreated service is found again at
# its new address without restarting nginx.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Trust X-Forwarded-For only from the `traefik` network (file generated by deploy.sh from the
    # network's real subnet), then take the client address from it.
    include /etc/nginx/nexus/real-ip.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 10m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Compress text responses on the fly: the app's ~2.4 MB entry chunk shrinks to ~650 KB. Vary
    # keeps caches from handing a gzipped body to a client that did not ask. Already-compressed
    # formats (png, jpg, woff2) are left out. JSON is left out on purpose: API replies carry tokens
    # next to request-controlled text, and compressing both together leaks the secret's length
    # (BREACH). WebSocket and LiveKit upgrades are unaffected.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript text/javascript
               application/manifest+json image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

    # --- WebSocket (priority 200): messaging hub on :8081. The hub serves /api/ws itself, so the
    # path is passed through unchanged. Long timeouts: a quiet socket is not a dead one.
    location ^~ /api/ws {
        set $up nexus-messaging:8081;
        proxy_pass http://$up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;
        proxy_buffering off;
    }

    # --- LiveKit signalling: wss://<host>/livekit/ -> nexus-livekit:7880 (prefix stripped). Media does
    # not pass here; it uses the ports nexus-livekit publishes. The webhook (/internal/...) is not
    # routed: LiveKit reaches messaging over the internal network.
    location ^~ /livekit/ {
        set $up nexus-livekit:7880;
        rewrite ^/livekit/(.*)$ /$1 break;
        proxy_pass http://$up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;
        proxy_buffering off;
    }

    # --- Sub-resources of /api/workspaces/<id>/ owned by other services (priority 120 / 110) ---
    location ~ ^/api/workspaces/[^/]+/documents {
        set $up nexus-document:8080;
        proxy_pass http://$up;
        include /etc/nginx/nexus/proxy.inc;
    }
    location ~ ^/api/workspaces/[^/]+/(channels|chat-sections|chat-state) {
        set $up nexus-messaging:8080;
        proxy_pass http://$up;
        include /etc/nginx/nexus/proxy.inc;
    }
    location ~ ^/api/workspaces/[^/]+/asset {
        set $up nexus-asset:8080;
        proxy_pass http://$up;
        include /etc/nginx/nexus/proxy.inc;
    }
    location ~ ^/api/workspaces/[^/]+/drive {
        set $up nexus-drive:8080;
        proxy_pass http://$up;
        include /etc/nginx/nexus/proxy.inc;
    }
    location ~ ^/api/workspaces/[^/]+/contacts {
        set $up nexus-auth:8080;
        proxy_pass http://$up;
        include /etc/nginx/nexus/proxy.inc;
    }

    # --- auth (110): /api/auth*, /api/me and /api/me/* only (not /api/messages) ---
    location /api/auth {
        set $up nexus-auth:8080;
        proxy_pass http://$up;
        include /etc/nginx/nexus/proxy.inc;
    }
    # Push preferences live in messaging; ^~ wins over the /api/me regex below.
    location ^~ /api/me/push-preferences {
        set $up nexus-messaging:8080;
        proxy_pass http://$up;
        include /etc/nginx/nexus/proxy.inc;
    }
    location ~ ^/api/me(/|$) {
        set $up nexus-auth:8080;
        proxy_pass http://$up;
        include /etc/nginx/nexus/proxy.inc;
    }

    # --- workspace (100): everything else under /api/workspaces, plus invitations ---
    location /api/workspaces {
        set $up nexus-workspace:8080;
        proxy_pass http://$up;
        include /etc/nginx/nexus/proxy.inc;
    }
    location /api/invitations {
        set $up nexus-workspace:8080;
        proxy_pass http://$up;
        include /etc/nginx/nexus/proxy.inc;
    }

    # --- document (120) ---
    location /api/documents {
        set $up nexus-document:8080;
        proxy_pass http://$up;
        include /etc/nginx/nexus/proxy.inc;
    }

    # --- messaging REST (120). /api/polls, /api/tasks and /api/calls are served by messaging too. ---
    location ~ ^/api/(channels|messages|dms|threads|notifications|polls|tasks|calls) {
        set $up nexus-messaging:8080;
        proxy_pass http://$up;
        include /etc/nginx/nexus/proxy.inc;
    }

    # --- asset (120) ---
    location ~ ^/api/(assets|asset-types|asset-requests) {
        set $up nexus-asset:8080;
        proxy_pass http://$up;
        include /etc/nginx/nexus/proxy.inc;
    }

    # --- drive (120) ---
    location /api/drive {
        set $up nexus-drive:8080;
        proxy_pass http://$up;
        include /etc/nginx/nexus/proxy.inc;
    }

    # --- approval (120) ---
    location /api/approval {
        set $up nexus-approval:8080;
        proxy_pass http://$up;
        include /etc/nginx/nexus/proxy.inc;
    }

    # Any other /api path has no service: say so, instead of answering with the SPA's HTML.
    # (/api/admin is deliberately not routed publicly, as in the dev Traefik rules.)
    location /api/ {
        default_type application/json;
        return 404 '{"error":"not found"}';
    }

    # --- PWA: the service worker and manifest must always be revalidated. An exact-match location
    # wins over the long-cache regex below, which would otherwise pin a stale sw.js for 30 days and
    # leave installed apps on an old version. The worker sits at the root, so its scope is "/" and
    # no Service-Worker-Allowed header is needed. add_header does not inherit once a location sets
    # its own, so the security headers are repeated.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # OneSignal registers this name; it imports /sw.js, so it is revalidated the same way.
    location = /OneSignalSDKWorker.js {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- SPA ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Not under /api: a regex location beats a plain prefix, and /api/drive/files/x.png is the drive's.
    location ~* ^(?!/api/).+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
