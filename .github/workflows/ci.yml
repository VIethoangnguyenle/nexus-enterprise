name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go — build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ngac
          POSTGRES_USER: ngac
          POSTGRES_PASSWORD: ngac_secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ngac"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ngac:ngac_secret@localhost:5432/ngac?sslmode=disable
      TEST_REDIS_ADDR: localhost:6379
      REDIS_ADDR: localhost:6379
      PGPASSWORD: ngac_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/**/go.sum
      # The same chain `make db-migrate` applies: base schema, then the numbered migrations.
      - name: Apply schema
        run: |
          psql -h localhost -U ngac -d ngac -v ON_ERROR_STOP=1 -q -f data/init.sql
          for f in $(ls data/migrations/*.sql | sort); do
            psql -h localhost -U ngac -d ngac -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Build every service
        run: make build-check
      # Runs each service from its own module (`go test ./...` from backend/ tests nothing)
      # and treats a skipped test as a failure.
      - name: Test
        run: make test

  frontend:
    name: Frontend — lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Fails only on type errors beyond the recorded per-file baseline.
      - run: npm run typecheck:diff
      - run: npm test
      - run: npm run build

  docs:
    name: Docs — CLAUDE.md drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-docs-drift.sh
      # Operation strings and node names come from backend/ngac, never from inline literals.
      - run: bash scripts/check-ngac-identifiers.sh --self-test
      - run: bash scripts/check-ngac-identifiers.sh
      # Shared start-up and error helpers, REST calls the domain, no SQL in a transport,
      # no dropped store errors (see scripts/check-backend-layering.sh).
      - run: bash scripts/check-backend-layering.sh --self-test
      - run: bash scripts/check-backend-layering.sh
