name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go — build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ngac
          POSTGRES_USER: ngac
          POSTGRES_PASSWORD: ngac_secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ngac"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ngac:ngac_secret@localhost:5432/ngac?sslmode=disable
      TEST_REDIS_ADDR: localhost:6379
      REDIS_ADDR: localhost:6379
      PGPASSWORD: ngac_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/**/go.sum
      # The same chain `make db-migrate` applies: base schema, then the numbered migrations.
      - name: Apply schema
        run: |
          psql -h localhost -U ngac -d ngac -v ON_ERROR_STOP=1 -q -f data/init.sql
          for f in $(ls data/migrations/*.sql | sort); do
            psql -h localhost -U ngac -d ngac -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Build every service
        run: make build-check
      # Runs each service from its own module (`go test ./...` from backend/ tests nothing)
      # and treats a skipped test as a failure.
      - name: Test
        run: make test

  frontend:
    name: Frontend — lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Fails only on type errors beyond the recorded per-file baseline.
      - run: npm run typecheck:diff
      - run: npm test
      - run: npm run build

  docs:
    name: Docs — CLAUDE.md drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-docs-drift.sh
      # Operation strings and node names come from backend/ngac, never from inline literals.
      - run: bash scripts/check-ngac-identifiers.sh --self-test
      - run: bash scripts/check-ngac-identifiers.sh
      # Shared start-up and error helpers, REST calls the domain, no SQL in a transport,
      # no dropped store errors (see scripts/check-backend-layering.sh).
      - run: bash scripts/check-backend-layering.sh --self-test
      - run: bash scripts/check-backend-layering.sh
      # Production stack (docs/deployment.md): the compose file must resolve with a dummy env and
      # pass the structural/environment checks (no published port or host network, only the edge
      # on the shared network, every service has the variables its main reads); the nginx edge
      # config must parse; the deploy scripts must pass shellcheck.
      - name: Check production compose
        run: bash deploy/check-compose-env.sh
      - name: Test nginx edge config
        run: |
          # deploy.sh generates real-ip.conf from the traefik network at deploy time; stand in for it.
          cp -r deploy/nginx "$RUNNER_TEMP/nginx"
          echo 'set_real_ip_from 172.16.0.0/12;' >"$RUNNER_TEMP/nginx/real-ip.conf"
          docker run --rm \
            -v "$RUNNER_TEMP/nginx:/etc/nginx/nexus:ro" \
            -v "$RUNNER_TEMP/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t
      - name: Shellcheck deploy scripts
        run: shellcheck -S warning deploy/*.sh

  # Every image deploy.yml pushes must build: a Dockerfile that misses a COPY only fails when the
  # image is built, which would otherwise be after merge. Builds only, nothing is pushed.
  images:
    name: Images — ${{ matrix.image }} builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: policy,      context: backend,  file: backend/services/policy/Dockerfile }
          - { image: policy-read, context: backend,  file: backend/services/policy/Dockerfile.read }
          - { image: auth,        context: backend,  file: backend/services/auth/Dockerfile }
          - { image: workspace,   context: backend,  file: backend/services/workspace/Dockerfile }
          - { image: document,    context: backend,  file: backend/services/document/Dockerfile }
          - { image: messaging,   context: backend,  file: backend/services/messaging/Dockerfile }
          - { image: asset,       context: backend,  file: backend/services/asset/Dockerfile }
          - { image: drive,       context: backend,  file: backend/services/drive/Dockerfile }
          - { image: approval,    context: backend,  file: backend/services/approval/Dockerfile }
          - { image: frontend,    context: frontend, file: frontend/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t "nexus-${{ matrix.image }}:ci" -f "${{ matrix.file }}" "${{ matrix.context }}"
