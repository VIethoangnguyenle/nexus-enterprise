name: Deploy

# main -> CI green -> images pushed to GHCR -> manual approval (environment "production") ->
# deploy to the VPS behind the shared Traefik. workflow_dispatch redeploys the current main, or a
# tag that already exists in GHCR (rollback): then nothing is rebuilt. See docs/deployment.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy without rebuilding (a commit SHA built earlier). Empty: build and deploy this commit."
        required: false
        type: string

# Whole runs never overlap; a newer run waits (and replaces any older waiting one).
concurrency:
  group: nexus-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_HOST: 160.187.146.173
  DEPLOY_USER: root
  APP_DIR: /opt/nexus
  PUBLIC_URL: https://nexus.zaneng.xyz

jobs:
  meta:
    name: Resolve what to deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only a green CI run from a push to this repository's main, or a manual run on main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
      build: ${{ steps.resolve.outputs.build }}
      owner: ${{ steps.resolve.outputs.owner }}
    steps:
      - id: resolve
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_run ]; then
            sha=$RUN_SHA
          else
            sha=$DISPATCH_SHA
          fi
          tag=$sha
          build=true
          if [ -n "${INPUT_TAG:-}" ]; then
            [[ $INPUT_TAG =~ ^[A-Za-z0-9._-]{1,128}$ ]] || { echo "::error::invalid tag"; exit 1; }
            tag=$INPUT_TAG
            build=false
          fi
          {
            echo "sha=$sha"
            echo "tag=$tag"
            echo "build=$build"
            echo "owner=${GITHUB_REPOSITORY_OWNER,,}"
          } >>"$GITHUB_OUTPUT"

  build:
    name: Image / ${{ matrix.image }}
    needs: meta
    if: needs.meta.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { image: policy,      context: backend,  file: backend/services/policy/Dockerfile }
          - { image: policy-read, context: backend,  file: backend/services/policy/Dockerfile.read }
          - { image: auth,        context: backend,  file: backend/services/auth/Dockerfile }
          - { image: workspace,   context: backend,  file: backend/services/workspace/Dockerfile }
          - { image: document,    context: backend,  file: backend/services/document/Dockerfile }
          - { image: messaging,   context: backend,  file: backend/services/messaging/Dockerfile }
          - { image: asset,       context: backend,  file: backend/services/asset/Dockerfile }
          - { image: drive,       context: backend,  file: backend/services/drive/Dockerfile }
          - { image: approval,    context: backend,  file: backend/services/approval/Dockerfile }
          - { image: frontend,    context: frontend, file: frontend/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ needs.meta.outputs.owner }}/nexus-${{ matrix.image }}:${{ needs.meta.outputs.sha }}
            ghcr.io/${{ needs.meta.outputs.owner }}/nexus-${{ matrix.image }}:main
          # Links the package to this repository, so the job token can pull it.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.meta.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy:
    name: Deploy to production
    needs: [meta, build]
    # build is skipped when redeploying an existing tag.
    if: ${{ !cancelled() && needs.meta.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewers on this environment hold the job until someone approves.
    environment:
      name: production
      url: https://nexus.zaneng.xyz
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      OWNER: ${{ needs.meta.outputs.owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.sha }}
          persist-credentials: false

      - name: Prepare SSH (pinned host key)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_KNOWN_HOSTS" ] || { echo "::error::DEPLOY_SSH_KEY / DEPLOY_KNOWN_HOSTS not set"; exit 1; }
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >~/.ssh/known_hosts
          cat >~/.ssh/config <<CONF
          Host nexus-prod
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 30
            ServerAliveCountMax 10
          CONF
          ssh nexus-prod true

      - name: Sync release files
        env:
          BUILD: ${{ needs.meta.outputs.build }}
        run: |
          set -euo pipefail
          rel="$APP_DIR/releases/$TAG"
          # Redeploying an existing tag (rollback) keeps the files that release shipped with.
          if [ "$BUILD" = false ] && ssh nexus-prod "test -f '$rel/docker-compose.yml'" </dev/null; then
            echo "release $TAG already on the server: keeping its files"
            exit 0
          fi
          stage=$(mktemp -d)
          cp deploy/docker-compose.prod.yml "$stage/docker-compose.yml"
          cp deploy/migrate.sh deploy/deploy.sh "$stage/"
          mkdir -p "$stage/db" "$stage/nginx"
          cp deploy/nginx/default.conf deploy/nginx/proxy.inc "$stage/nginx/"
          cp data/init.sql "$stage/db/init.sql"
          cp -r data/migrations "$stage/db/migrations"
          ssh nexus-prod "install -d -m 750 '$APP_DIR/releases' '$rel'" </dev/null
          # No -o/-g: everything lands root-owned on the server (we connect as root), never as the
          # runner's uid. Directories 750, files without group/other write. real-ip.conf is
          # generated on the server by deploy.sh and must survive --delete.
          rsync -rlptz --delete --chmod=D750,Fgo-w \
            --exclude=/nginx/real-ip.conf \
            "$stage"/ "nexus-prod:$rel/"

      - name: Remember the running tag
        id: prev
        run: |
          set -euo pipefail
          prev=$(ssh nexus-prod "cat $APP_DIR/.deployed-tag 2>/dev/null || true" </dev/null | tr -d '[:space:]')
          # Read from the server, then used in later commands: same rule as any other tag.
          if [ -n "$prev" ] && ! [[ $prev =~ ^[A-Za-z0-9._-]{1,128}$ ]]; then
            echo "::error::.deployed-tag on the server holds an invalid value"; exit 1
          fi
          echo "tag=$prev" >>"$GITHUB_OUTPUT"
          echo "Currently deployed: ${prev:-nothing}"

      - name: Pull, migrate, start
        id: deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          # The token travels on stdin only: never in argv, never on the server's disk (deploy.sh
          # logs in inside a private, throw-away docker config).
          printf '%s' "$GHCR_TOKEN" |
            ssh nexus-prod "cd '$APP_DIR/releases/$TAG' && NEXUS_OWNER='$OWNER' GHCR_USER='$GHCR_USER' ./deploy.sh '$TAG'"

      - name: Health check
        id: health
        run: |
          set -euo pipefail
          curl -fsS -o /dev/null --retry 12 --retry-delay 5 --retry-all-errors --max-time 15 "$PUBLIC_URL/"
          # The SPA answers 200 for any path, so require the auth API's JSON, not an HTML fallback.
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors --max-time 15 "$PUBLIC_URL/api/auth/providers" | jq -e . >/dev/null
          echo "healthy: $PUBLIC_URL"

      - name: Roll back to the previous release
        if: ${{ failure() && steps.prev.outputs.tag != '' && (steps.deploy.outcome == 'failure' || steps.health.outcome == 'failure') }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          PREV: ${{ steps.prev.outputs.tag }}
        run: |
          set -euo pipefail
          echo "::warning::Deploy of $TAG failed; redeploying $PREV from its own release files, without migrations"
          printf '%s' "$GHCR_TOKEN" |
            ssh nexus-prod "cd '$APP_DIR/releases/$PREV' && ROLLBACK=1 NEXUS_OWNER='$OWNER' GHCR_USER='$GHCR_USER' ./deploy.sh '$PREV'"

      - name: Remove the runner-side key
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts ~/.ssh/config
